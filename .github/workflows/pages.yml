# Publishes the game to GitHub Pages every time you push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-fonts.mjs
      - uses: actions/configure-pages@v5
      # The game is published at the site root. A copy also goes in web/, the address
      # older home-screen installs still open, so those keep working with the same save.
      - run: mkdir -p _site && cp -r web/. _site/ && mkdir -p _site/web && cp -r web/. _site/web/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
